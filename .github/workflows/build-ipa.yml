name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned, for device)
        run: |
          xcodebuild build \
            -project NuggetUI.xcodeproj \
            -scheme NuggetUI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          set -eu
          APP_PATH="build/Build/Products/Release-iphoneos/NuggetUI.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y NuggetUI-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuggetUI-unsigned-ipa
          path: NuggetUI-unsigned.ipa
          if-no-files-found: error
